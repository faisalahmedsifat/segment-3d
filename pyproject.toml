[project]
name = "segment3d"
version = "0.1.0"
description = "AI-powered interactive 3D model segmentation desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyQt5>=5.15.0",
    "vtk>=9.0.0",
    "opencv-python>=4.5.0",
    "pillow>=8.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.0.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "numpy-stl>=3.0.0",
    "trimesh>=3.0.0",
    "modal>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
default-groups = []
